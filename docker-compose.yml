# Camada 1 só MongoDB configurado .
# Camada 2 o Kafka entra.

name : schedule-patrol-api

services:
  mongo:
    image: mongo:8.0
    container_name: schedule-patrol-mongo
    restart: unless-stopped

    environment:
    
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}

    ports:
    # Somente conexão local 
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

    volumes:
      - mongo-data:/data/db
      # Script de inicialização só executa uma vez.
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    
volumes:
    mongo-data:
