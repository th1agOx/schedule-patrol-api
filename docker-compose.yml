name : schedule-patrol-api

services:
  mongo:
    image: mongo:8.0
    container_name: schedule-patrol-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}

    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

    volumes:
      - mongo-data:/data/db

      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    image: schedule-patrol-api:local
    container_name: schedule-patrol-api
    restart: unless-stopped

    depends_on:
      mongo:
        condition: service_healthy

    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}

    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
    mongo-data:
